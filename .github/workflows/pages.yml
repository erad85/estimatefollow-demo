name: Validate and publish EstimateFollow
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: estimatefollow-pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm required demo assets and no private files
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/manifest.webmanifest
          test -s public/sw.js
          test -s public/icons/icon.svg
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path("public")
          expected={"index.html","manifest.webmanifest","sw.js","icons/icon.svg"}
          found={p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file()}
          assert found==expected,(found,expected)
          m=json.loads((root/"manifest.webmanifest").read_text())
          assert m["start_url"]=="./index.html"
          html=(root/"index.html").read_text()
          assert "estimatefollow" in html.lower()
          assert "icons/icon.svg" in html
          assert "serviceWorker" in html
          assert "example.com" in html
          print("Public demo asset preflight passed")
          PY
  mobile-quote-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser testing tools
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Test Save visibility and persistence at three mobile sizes
        run: python tests/test_mobile_quote_playwright.py
  service-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test the sanitized estimate audit
        run: python3 -m unittest discover -s services -p 'test_*.py' -v
      - name: Generate sample deliverable with fictional data
        run: python3 services/estimate_audit.py services/sample_estimates.csv --as-of 2026-11-07 --output /tmp/estimate-review.md
      - name: Verify sample deliverable describes opportunity, not revenue
        run: |
          grep -q 'Follow-up candidates: \*\*2\*\*' /tmp/estimate-review.md
          grep -q 'not revenue' /tmp/estimate-review.md
  publish:
    needs: [verify, mobile-quote-e2e, service-audit]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
